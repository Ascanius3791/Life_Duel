name: CI and GitHub Pages

# Native build + tests, then the static Life Duel site (C++ engine as
# WebAssembly), deployed to GitHub Pages from main. Pull requests only build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only one deployment at a time; a newer push supersedes a queued one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  EMSDK_VERSION: 6.0.12

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGOL_NATIVE=OFF
          cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"
      - name: Build the static site (runs the core tests under node)
        run: tools/build_site.sh dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [native, site]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
